/* GitHubDA — Refined UI system V3. Editorial clarity, designed for desktop and mobile. */
:root{
  --bg:#f7f8f6;--paper:#ffffff;--sidebar:#fdfefd;--ink:#202923;
  --muted:#68746d;--soft:#8a968d;--line:#e3e8e2;--line2:#edf0ec;
  --hover:#f0f3ef;--wash:#f3f6f2;--field:#fff;
  --green:#255a44;--green2:#eaf2ed;--danger:#bd5c4b;--warning:#966527;
  --shade:0 16px 46px rgba(30,45,34,.055);
  --radius-control:10px;--content-width:1230px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#141a17;--paper:#1c2420;--sidebar:#181f1b;--ink:#eff3ef;
  --muted:#afb9b1;--soft:#88968d;--line:#313c35;--line2:#29352e;
  --hover:#253128;--wash:#202c24;--field:#202923;
  --green:#a7daba;--green2:#263a2d;--danger:#eea498;--warning:#eac18b;
  --shade:0 16px 46px rgba(0,0,0,.16);
}
html,body{scroll-behavior:smooth}
body{font-size:14.5px;line-height:1.58;letter-spacing:.005em;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-kerning:normal;text-rendering:optimizeLegibility;
}
h1,h2,h3,.brand-name,.stat-val{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans CJK SC",sans-serif;}
button,input,select{letter-spacing:inherit}button,.navitem,.tab,.seg{transition:background-color .14s,color .14s,border-color .14s,box-shadow .14s}
button:focus-visible,input:focus-visible,select:focus-visible,.repo-row:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.app{grid-template-columns:235px minmax(0,1fr)}
.sidebar{padding:26px 17px 21px;border-color:var(--line2)}
.brand{margin-bottom:43px;padding:0 11px;gap:12px}
.brand-mark{height:36px;width:36px;border-radius:11px;font-size:17px;letter-spacing:-1px;box-shadow:0 4px 12px rgba(0,0,0,.09)}
.brand-name{font-size:16px;font-weight:730;letter-spacing:-.5px}
.brand-sub{font-size:11px;letter-spacing:.1px;font-weight:460;line-height:1.4;margin-top:2px;color:var(--muted)}
.navlist{gap:4px}
.navitem{min-height:42px;padding:9px 13px;border-radius:9px;font-size:14px;font-weight:510;gap:12px}
.navitem .icon{height:17px;width:17px;opacity:.82}
.navitem.active{background:var(--green2);color:var(--ink);font-weight:660}
.navitem.active .icon{color:var(--green);opacity:1}
.side-foot{padding-top:14px}
.side-caption{margin:0 0 6px 12px;font-size:11px;letter-spacing:.2px;text-transform:none;color:var(--soft);font-weight:550}
.side-foot .navitem{min-height:39px;font-size:12.5px;padding:8px 12px}
.side-status{font-size:11.5px;padding:11px 12px 3px}
.topline{height:70px;padding:0 clamp(26px,4.25vw,76px);border-color:var(--line2)}
.crumbs{font-size:12.5px;letter-spacing:.005em}
.crumbs span{font-weight:630}
.topright{gap:13px}
.keyhint{height:36px;min-width:180px;font-size:12px;background:var(--paper);padding:7px 11px;border-radius:10px}
.keyhint kbd{margin-left:auto;font-size:10px;opacity:.9}
.mock-label{background:var(--wash);border-color:transparent;border-radius:7px;padding:7px 10px;color:var(--muted);font-size:10.5px;letter-spacing:.025em;font-weight:650}
.icon-btn{height:36px;width:36px}
.content{max-width:var(--content-width);padding:49px clamp(26px,4.25vw,76px) 90px}
.eyebrow{font-size:10px;font-weight:740;letter-spacing:.16em;margin-bottom:18px;color:var(--green)}
.eyebrow:before{width:17px}
.hero-heading{font-size:clamp(39px,3.75vw,53px);line-height:1.18;letter-spacing:-.047em;font-weight:740;max-width:760px}
.hero-sub{margin-top:19px;font-size:15px;color:var(--muted);line-height:1.85;max-width:650px}
.page-title{font-size:34px;line-height:1.24;letter-spacing:-.035em;font-weight:700}
.page-sub{font-size:14px;line-height:1.7;margin-top:10px;color:var(--muted)}
.page-head{margin-bottom:34px;align-items:center}
.page-actions{gap:8px}
.section-head{margin-bottom:16px;align-items:center}
.section-head h2{font-size:19px;letter-spacing:-.025em;font-weight:680}
.section-link{font-size:12.5px;gap:6px}
.section-meta{font-size:12.5px}
.small{font-size:12.5px}.tiny{font-size:12px}.mini-label{font-size:12px}.muted{color:var(--muted)}
.btn{min-height:40px;padding:9px 15px;border-radius:var(--radius-control);font-size:13px;font-weight:600;gap:8px;line-height:1.2}
.btn.small{min-height:37px;padding:8px 13px;font-size:12.5px}
.btn.primary{font-weight:650;background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink);opacity:.89}
.btn:hover:not(:disabled){box-shadow:0 2px 8px rgba(20,30,25,.035)}
.field{height:42px;padding:0 14px;border-radius:10px;font-size:13px;line-height:1.3}
.field::placeholder{color:var(--soft)}
select.field{min-width:134px}
.input-wrap .icon{left:13px}
.input-wrap input{padding-left:39px}
.hero-search{margin-top:34px;max-width:780px;border-radius:15px;padding:8px;background:var(--paper);box-shadow:var(--shade);gap:6px}
.hero-search .icon{margin-left:14px;height:18px;width:18px}
.hero-search input{padding:13px 8px;font-size:14px;letter-spacing:.005em}
.hero-search .btn{min-height:45px;padding:10px 19px;font-size:13px}
.inline-hint{font-size:12px;margin-top:12px;color:var(--muted)}
.overview-metrics{margin-top:51px;padding:24px 0 23px}
.stat{padding:0 26px}
.stat-name{font-size:12.5px;margin-bottom:9px;font-weight:520}
.stat-val{font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.stat-note{font-size:11.5px;margin-top:8px;line-height:1.45}
.overview-columns{gap:50px;margin-top:47px;grid-template-columns:minmax(0,1.47fr) minmax(290px,.93fr)}
.compact-list{border-color:var(--line)}
.list-entry{min-height:74px;padding:14px 6px;gap:13px}
.list-entry:hover,.repo-row:hover,.task-line:hover{background:var(--hover)}
.repo-emblem{width:37px;height:37px;border-radius:10px;font-size:14px}
.entry-name{font-size:14px;font-weight:650;letter-spacing:-.012em}
.entry-desc{font-size:12px;line-height:1.55;margin-top:5px}
.entry-detail{font-size:12px}
.entry-side{gap:10px}
.entry-click{height:34px;width:34px;display:grid;place-items:center}
.state{font-size:12px;font-weight:550;gap:8px}
.state:before{width:6px;height:6px}
.task-plain{padding:15px 0;gap:11px}
.task-plain strong{font-size:13.5px}
.task-plain p{font-size:12px;margin-top:5px}
.quiet-panel{border:1px solid var(--line2);background:var(--wash);padding:19px 20px;border-radius:11px;margin-top:18px}
.quiet-panel strong{font-size:13px}
.quiet-panel p{font-size:12px;line-height:1.7;margin-top:7px}
/* Repository sections */
.tabs{gap:26px;margin-bottom:26px}
.tab{font-size:13.5px;font-weight:520;padding-bottom:13px}
.tab.active{font-weight:670}
.toolbar{gap:12px;margin-bottom:19px;align-items:center}
.toolbar-left{flex:1;min-width:0}
.toolbar-left .input-wrap{width:min(100%,340px);min-width:0}
.toolbar-right{gap:9px}
.toolbar .field{max-width:250px}
.repo-row,.col-labels{grid-template-columns:22px 38px minmax(200px,1.7fr) minmax(82px,.6fr) minmax(82px,.6fr) minmax(95px,.65fr) 35px;gap:15px}
.col-labels{padding:12px 5px;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.repo-row{min-height:85px;padding:15px 5px;gap:15px}
.repo-row .entry-name{font-size:14px}
.repo-row .entry-desc{font-size:12px;margin-top:6px}
.rnum{font-size:12.5px}
.check{width:16px;height:16px;accent-color:#3a7055}
.pagination{font-size:12px}
.discover-item{padding:16px 5px;gap:15px;min-height:88px}
.discover-item .entry-desc{max-width:620px}
.discover-foot{font-size:11.5px;margin-top:8px;gap:11px}
.pill{font-size:11.5px;border-radius:7px;padding:4px 8px}
.ghost-link{font-size:13px}
.search-box-inline{gap:10px}
.search-box-inline .field{height:43px}
/* Detail and data-heavy views */
.detail-head{margin-bottom:25px}
.detail-head h1{font-size:30px;font-weight:690;letter-spacing:-.035em}
.detail-head p{font-size:13px;line-height:1.6}
.detail-tags{gap:10px;margin-bottom:31px}
.detail-grid{padding:25px 0;margin-bottom:34px}
.backlink{font-size:12.5px;margin-bottom:24px}
.data-block strong{font-size:13.5px}
.data-block p{font-size:12.5px;line-height:1.65}
.summary-box{border-radius:12px;padding:22px 24px}
.summary-box h3{font-size:14px}
.summary-box p{font-size:13px;line-height:1.75}
.compare-head h2{font-weight:640}
.compare-chip{font-size:12.5px;padding:8px 10px;border-radius:9px}
.compare-table{font-size:13px}
.compare-table th{font-size:12.5px}
.compare-table th,.compare-table td{padding:17px 13px}
.disclaimer{font-size:12px;line-height:1.8}
.research-controls{margin-bottom:25px}
.research-intro{padding:19px 0}
.research-intro strong{font-size:14px;font-weight:660}
.research-intro p{font-size:12px;line-height:1.75}
.research-sums{margin:26px 0 32px}
.table-lite{font-size:13px}
.table-lite th{font-size:12px;padding:12px 10px}
.table-lite td{padding:15px 10px}
.table-lite .muted{font-size:12px}
.dist-row{font-size:13px;grid-template-columns:130px minmax(0,1fr) 60px}
.tag-plain{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px}
.quality-line strong{font-size:13.5px}
.quality-line p{font-size:12px;line-height:1.65}
.task-tabs{border-bottom:1px solid var(--line);gap:20px;margin-bottom:8px}
.seg{border-radius:0;padding:12px 3px 13px;font-size:13px;position:relative;background:transparent}
.seg.active{background:transparent;color:var(--ink);font-weight:670}
.seg.active:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--ink)}
.seg:hover{color:var(--ink)}
.task-line{min-height:78px;padding:15px 5px;grid-template-columns:minmax(0,1.5fr) 110px minmax(100px,.6fr) 38px;gap:18px}
.task-line strong{font-size:13.5px}
.task-line .tiny{font-size:11.5px}
.selected-task{border:1px solid var(--line2);padding:24px 26px;border-radius:13px}
.selected-task h3{font-size:18px}
.task-info-grid span{font-size:11.5px}
.task-info-grid strong{font-size:13px}
.step-list li{font-size:12.5px}
/* Feedback & interaction */
.empty{border-color:var(--line);border-radius:12px}
.empty strong{font-size:15px}
.empty p{font-size:13px;line-height:1.8}
.modal{width:min(500px,100%);border-radius:16px;padding:26px 28px;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.modal h2{font-size:20px;letter-spacing:-.035em}
.modal p{font-size:13px;line-height:1.75}
.modal-head{margin-bottom:18px}
.setting-row{padding:18px 0}
.setting-row strong{font-size:13.5px}
.setting-row p{font-size:12px}
.setting-options button{font-size:12.5px;padding:8px 11px}
.search-result{padding:14px 10px}
.search-result span{font-size:13.5px}
.search-result small{font-size:12px}
.toast{font-size:13px;padding:13px 16px}

</style></head><body><div id="app"></div><script>/* GitHubDA — Minimal interactive design study. All values and operations are mock. */

 ['vuejs/core','Vue 3 核心运行时、编译器与响应式系统','TypeScript',48620,8400,1530,312,189,38,1],

function mockRepo(row,i){let [name,description,language,stars,forks,commits,issues,prs,releases,updated]=row;return {id:1000+i,name,description,language,stars,forks,commits,issues,prs,releases,updated,coverage:i===4?'partial':'complete',status:i===4?'partial':'completed',added:now(5+i*4),collected:now(i*7+1),series:Array.from({length:9},(_,j)=>Math.round(stars*(.82+j*.022)+(i*5)))};}
const seed=()=>({repos:catalog.map(mockRepo),library:[1000,1001,1002,1004],selected:[],tasks:[{id:701,repoId:1002,type:'deep',status:'succeeded',progress:100,created:now(2),message:'深度分析已完成'},{id:700,repoId:1004,type:'deep',status:'partial',progress:100,created:now(7),message:'部分模块覆盖不完整'},{id:699,repoId:1006,type:'basic',status:'failed',progress:32,created:now(26),message:'GitHub API 达到请求限制'}],theme:'light',density:'normal',nextTask:702,nextRepo:2000});

const emblem=(r)=>`<div class="repo-emblem" aria-hidden="true">${esc(r.name.split('/')[1]?.slice(0,1).toUpperCase()||'G')}</div>`;

function routeHash(){const h=location.hash.replace(/^#\//,'');const match=/^repository\/(\d+)$/.exec(h);if(match){ui.repoId=Number(match[1]);ui.page='detail';}else if(['overview','repositories','research','tasks','compare'].includes(h))ui.page=h;else ui.page='overview';ui.mobile=false;render();}
function navigation(){return [['overview','总览','home'],['repositories','仓库','repo'],['research','研究','research'],['tasks','任务','tasks']].map(([route,label,ic])=>`<button class="navitem ${ui.page===route||ui.page==='detail'&&route==='repositories'||ui.page==='compare'&&route==='repositories'?'active':''}" data-action="nav" data-id="${route}">${ico(ic)}${label}</button>`).join('');}

function overview(){const lib=library(),tasks=activeTasks(),latest=lib.slice().sort((a,b)=>new Date(b.collected)-new Date(a.collected));return `<section class="home-intro"><h1 class="hero-heading">分析 GitHub 仓库</h1><p class="hero-sub">输入仓库地址，查看项目近期活动与协作数据。</p><form class="hero-search" id="hero-form">${ico('search')}<input aria-label="输入仓库地址" name="repo" id="hero-repo" placeholder="仓库链接或 owner/repo" value="${esc(ui.inputRepo)}" autocomplete="off" required><button class="btn primary" type="submit">开始分析 ${ico('arrow')}</button></form><div class="inline-hint">例如 vuejs/core、psf/requests。当前使用本地演示数据。</div></section><div class="overview-metrics">${stat('已添加仓库',lib.length)}${stat('分析已完成',lib.filter(r=>r.status==='completed').length)}${stat('进行中任务',tasks.length)}${stat('最近采集',lib.length?dt(latest[0].collected):'—')}</div><div class="overview-columns"><section><div class="section-head"><h2>最近仓库</h2>${linkBtn('查看全部','nav','repositories')}</div>${lib.length?`<div class="compact-list">${latest.slice(0,4).map(summaryRow).join('')}</div>`:empty('暂无仓库','输入上方仓库地址开始分析。','',true)}</section><section><div class="section-head"><h2>最近任务</h2>${linkBtn('查看全部','nav','tasks')}</div>${data.tasks.length?data.tasks.slice(0,4).map(taskPlain).join(''):empty('暂无任务','开始分析后，任务记录会显示在这里。','',true)}</section></div>`;}

/span><span></span></div><div class="list-board">${view.length?view.map(repoRow).join(''):empty('没有符合条件的仓库','尝试其他关键词，或从发现页添加。','discover-go')}</div><div class="pagination"><span>${view.length} 个结果 · 最多选择 5 个仓库进行对比</span><button class="ghost-link" data-action="discover-go">发现更多仓库 ${ico('arrow','sm')}</button></div>${data.selected.length?`<div class="selection-bar"><span class="small">已选择 ${data.selected.length} 个仓库 <span style="opacity:.55">/ 2–5 个可对比</span></span><div style="display:flex;gap:8px">${btn('清除','clear-selected',{small:true})}${btn('比较所选','compare-go',{small:true,disabled:data.selected.length<2||data.selected.length>5})}</div></div>`:''}`:discoverView()}`;}
function discoverView(){let q=ui.discoverQuery.trim().toLowerCase();let repos=data.repos.filter(r=>!data.library.includes(r.id)&&(!q||(r.name+' '+r.description).toLowerCase().includes(q))&&(ui.discoverLang==='all'||ui.discoverLang===r.language));return `<form id="discover-form" class="search-box-inline"><div class="input-wrap" style="flex:1">${ico('search')}<input class="field" name="query" value="${esc(ui.discoverQuery)}" placeholder="搜索名称、介绍或 owner/repo" aria-label="搜索公开仓库"></div><select class="field" name="language" aria-label="语言"><option value="all">所有语言</option>${['TypeScript','Python','Rust','JavaScript','Go'].map(x=>`<option ${ui.discoverLang===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn primary" type="submit">搜索</button></form><p class="mini-label" style="margin:12px 0 15px">演示目录 · ${repos.length} 个匹配结果。可直接添加并模拟分析任务。</p><div class="list-board">${repos.length?repos.map(r=>`<div class="discover-item">${emblem(r)}<div class="entry-main"><div class="entry-name">${esc(r.name)}</div><div class="entry-desc">${esc(r.description)}</div><div class="discover-foot"><span>${esc(r.language)}</span><span>${compact(r.stars)} Stars</span><span>${compact(r.forks)} Forks</span></div></div>${btn('开始分析','analyze-repo',{small:true,id:r.id})}</div>`).join(''):empty('没有匹配的仓库','试试其他关键词，或直接输入 owner/repo 开始模拟分析。','add-modal')}</div>`;}
function svgLine(values){if(!values||values.length<2)return `<div class="empty" style="padding:25px">暂无足够的真实观测点</div>`;let w=640,h=225,pad=12,min=Math.min(...values)*.99,max=Math.max(...values)*1.01,den=max-min||1;let dots=values.map((v,i)=>[pad+i*(w-2*pad)/(values.length-1),h-pad-(v-min)/den*(h-2*pad)]);let points=dots.map(x=>x.join(',')).join(' ');let area=`${dots[0][0]},${h} ${points} ${dots.at(-1)[0]},${h}`;return `<svg class="chart-svg" viewBox="0 0 640 225" role="img" aria-label="模拟趋势图"><defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".15"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>${[50,100,150,200].map(y=>`<line x1="0" y1="${y}" x2="640" y2="${y}" stroke="var(--line2)" stroke-width="1"/>`).join('')}<polygon points="${area}" fill="url(#chartFill)"/><polyline points="${points}" fill="none" stroke="var(--green)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>${dots.map((d,i)=>i===dots.length-1?`<circle cx="${d[0]}" cy="${d[1]}" r="4" fill="var(--green)" stroke="var(--paper)" stroke-width="2"/>`:'').join('')}</svg>`;}
function detail(){const r=getRepo(ui.repoId);if(!r)return `${header('仓库不存在','请选择一个已有仓库。')}${btn('返回仓库','nav',{id:'repositories'})}`;const live=activeTasks().find(t=>t.repoId===r.id);const t=taskFor(r.id);const metric=ui.compareMetric;let series=r.series.map(v=>metric==='stars'?v:Math.max(0,Math.round(v*(r.forks||1)/(r.stars||1))));return `<button class="backlink" data-action="nav" data-id="repositories">${ico('back','sm')} 返回仓库</button><div class="detail-head"><div class="detail-identity">${emblem(r)}<div style="min-width:0"><h1>${esc(r.name)}</h1><p>${esc(r.description)}</p></div></div><div class="page-actions">${btn('刷新数据','new-task',{id:r.id,small:true,icon:'refresh'})}${btn('深度分析','deep-task',{id:r.id,small:true,kind:'primary'})}</div></div><div class="detail-tags"><span class="pill">${esc(r.language)}</span>${stateTag(live?live.status:r.status)}<span class="pill">${r.coverage==='partial'?'部分覆盖':r.coverage==='unknown'?'尚未采集':'已采集'}</span><span class="mini-label">最近采集：${dt(r.collected)}</span></div>${live?`<div class="quiet-panel" style="margin-bottom:27px"><div class="task-controls"><strong>${stateTag(live.status)} · 正在采集</strong><span class="mono tiny">阶段 ${live.progress}%</span></div><div class="prog"><span style="width:${live.progress}%"></span></div><div class="spacer-8"></div>${linkBtn('查看详细进度','open-task',live.id)}</div>`:''}<div class="detail-grid">${stat('Stars',compact(r.stars),'仓库关注度')}${stat('Forks',compact(r.forks),'被复刻次数')}${stat('近 90 天提交',fmt(r.commits),'演示数据')}${stat('最近推送',r.updated+' 天前','演示数据')}</div><div class="tabs"><button class="tab ${ui.repoTab==='overview'?'active':''}" data-action="detail-tab" data-id="overview">分析概览</button><button class="tab ${ui.repoTab==='activity'?'active':''}" data-action="detail-tab" data-id="activity">活动与社区</button><button class="tab ${ui.repoTab==='metadata'?'active':''}" data-action="detail-tab" data-id="metadata">数据说明</button></div>${ui.repoTab==='overview'?`<div class="detail-columns"><section><div class="section-head"><h2>项目趋势</h2><span class="section-meta">演示观测点 / 9</span></div><div class="chart-card"><div class="chart-header"><div><div class="chart-title">${metric==='stars'?'Stars':'Forks'} 模拟趋势</div><div class="chart-sub">仅用于原型的时间序列样例</div></div><select class="chart-select" id="trend-metric"><option value="stars" ${metric==='stars'?'selected':''}>Stars</option><option value="forks" ${metric==='forks'?'selected':''}>Forks</option></select></div>${svgLine(series)}<div class="chart-note">此处使用演示时间序列。正式产品只展示真实已采集的观测点，不插值或虚构历史。</div></div></section><aside><div class="section-head"><h2>快速了解</h2></div><div class="summary-box"><h3>维护活动</h3><p>${r.updated==null?'该仓库刚加入演示目录，尚未生成可用的维护指标。':r.updated<=7?'模拟指标显示该项目近期有代码活动，可继续查看提交和社区协作情况。':'模拟指标显示项目近期更新频率较低。数据样本不足时不应推出项目质量结论。'}</p></div><div style="margin-top:24px">${[['主要语言',r.language],['数据范围',r.coverage==='partial'?'部分覆盖':'演示样本'],['最近采集',dt(r.collected)]].map(([k,v])=>`<div class="coverage-row"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}</div></aside></div>`:ui.repoTab==='activity'?`<div class="detail-columns"><section><div class="section-head"><h2>社区协作</h2></div><div class="meta-grid">${[['近 90 天提交',fmt(r.commits)],['已关闭 Issues',fmt(r.issues)],['已合并 PRs',fmt(r.prs)],['近一年 Releases',fmt(r.releases)]].map(([k,v])=>`<div class="data-block"><div class="data-key">${k}</div><div class="data-val mono">${v}</div></div>`).join('')}</div></section><aside><div class="quiet-panel" style="margin-top:0"><strong>关于指标</strong><p>这些是 演示 采集样例，不构成仓库质量评分。比较项目时应留意类型、时间窗口与覆盖范围。</p></div></aside></div>`:`<div class="section-head"><h2>数据来源与限制</h2></div><div class="meta-grid">${[['来源','演示 演示 dataset'],['覆盖范围',r.coverage==='partial'?'部分完成':'演示完整'],['采集时间',dt(r.collected)],['记录数量','不代表真实 GitHub 数量']].map(([k,v])=>`<div class="data-block"><div class="data-key">${k}</div><div class="data-val">${v}</div></div>`).join('')}</div><p class="disclaimer">演示数据与图表由原型预设。真实系统必须依照采集范围、最后成功快照和 API 返回的统计口径进行展示。</p>`}<hr class="section-rule"><div class="task-controls"><button class="ghost-link" data-action="nav" data-id="repositories">${ico('back','sm')} 所有仓库</button><div style="display:flex;gap:10px">${btn('加入对比','detail-add-compare',{small:true,id:r.id})}${data.library.includes(r.id)?btn('从列表移除','remove-ask',{small:true,id:r.id,kind:'danger'}):''}</div></div>`;}
function compare(){const chosen=data.selected.map(getRepo).filter(Boolean);const all=library().filter(r=>!data.selected.includes(r.id));const metrics=[['Stars','stars'],['Forks','forks'],['近 90 天提交','commits'],['关闭 Issues','issues'],['合并 PR','prs'],['近一年发布','releases']];return `${header('仓库对比','对照查看已选仓库的主要指标。',btn('导出对比','csv-compare',{icon:'download',small:true,disabled:chosen.length<2}))}<button class="backlink" data-action="nav" data-id="repositories">${ico('back','sm')} 返回仓库</button><div class="compare-head"><h2 style="font-size:18px">已选择 ${chosen.length} / 5</h2><select class="field" id="compare-add" aria-label="添加仓库"><option value="">＋ 添加仓库</option>${all.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="compare-tags">${chosen.map(r=>`<div class="compare-chip">${esc(r.name)} <button data-action="compare-remove" data-id="${r.id}" aria-label="移除 ${esc(r.name)}">${ico('cross','sm')}</button></div>`).join('')}</div>${chosen.length<2?empty('至少选择两个仓库','添加仓库后即可查看对比结果。'): `<div class="compare-scroll"><table class="compare-table"><thead><tr><th>比较维度</th>${chosen.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${metrics.map(([label,key])=>{const max=Math.max(...chosen.map(r=>r[key]||0));return `<tr><td>${label}</td>${chosen.map(r=>`<td class="${max>0&&r[key]===max?'highest':''}">${fmt(r[key])}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><p class="disclaimer">高亮仅标识数值较高。各仓库应使用一致的统计时间范围；此处为演示数据。</p>`}`;}
function research(){const frozen=ui.dataset==='oss-2025',size=frozen?24:0;const datasetName=frozen?'开源生态研究样本 · 2025':'开源生态研究样本 · 2026';const distribution=[['TypeScript',9],['Python',6],['Rust',5],['Go',4]];return `${header('研究','查看研究样本的统计结果与数据质量。',btn('导出数据','csv-research',{small:true,icon:'download',disabled:!size}))}<div class="research-controls"><div><select class="field" id="research-dataset" aria-label="选择研究数据集"><option value="oss-2026" ${!frozen?'selected':''}>研究样本 2026 · 尚未冻结</option><option value="oss-2025" ${frozen?'selected':''}>研究样本 2025 · 已冻结</option></select><select class="field" id="research-group" aria-label="研究分组"><option value="language" ${ui.group==='language'?'selected':''}>按语言</option><option value="stars" ${ui.group==='stars'?'selected':''}>按热度区间</option></select></div><span class="mini-label" style="align-self:center">演示样本</span></div><div class="research-intro"><div><strong>${datasetName}</strong><p>样本数 ${size} · 规则版本 1 · ${frozen?'已冻结':'未冻结'} · 与我的仓库互不影响</p></div><span class="tag-plain ${frozen?'':'warn'}">${frozen?'可展示研究统计':'尚未冻结'}</span></div>${!size?`<div style="max-width:690px;margin:45px auto">${empty('当前研究样本为空','当前样本没有可分析记录。可以切换到 2025 年示例样本。')}<div style="text-align:center">${btn('查看 2025 演示样本','switch-dataset',{small:true})}</div></div>`:`<div class="research-sums">${stat('研究样本','24','当前固定样本')}${stat('可分析记录','23','1 条缺失关键字段')}${stat('Stars 中位数','18.4k','示例统计')}</div><div class="tabs"><button class="tab ${ui.researchTab==='overview'?'active':''}" data-action="research-tab" data-id="overview">概览</button><button class="tab ${ui.researchTab==='distribution'?'active':''}" data-action="research-tab" data-id="distribution">分布</button><button class="tab ${ui.researchTab==='quality'?'active':''}" data-action="research-tab" data-id="quality">数据质量</button></div>${ui.researchTab==='overview'?`<div class="detail-columns"><section><div class="section-head"><h2>主要统计</h2></div><table class="table-lite"><thead><tr><th>统计指标</th><th>均值</th><th>中位数</th><th>有效样本</th></tr></thead><tbody><tr><td>Stars</td><td>31,600</td><td>18,400</td><td>23</td></tr><tr><td>Forks</td><td>5,210</td><td>2,980</td><td>23</td></tr></tbody></table><p class="disclaimer">中位数与均值基于演示样本。不要把样本统计当作整个 GitHub 的普遍分布。</p></section><aside><div class="quiet-panel" style="margin-top:0"><strong>统计说明</strong><p>比较样本中的公开指标，并查看缺失数据。结果只适用于当前样本。</p></div></aside></div>`:ui.researchTab==='distribution'?`<div class="section-head"><h2>${ui.group==='language'?'语言分布':'Stars 区间分布'}</h2><span class="mini-label">有效样本 n = 24</span></div><div style="max-width:760px">${(ui.group==='language'?distribution:[['0–10k',7],['10k–30k',9],['30k–100k',5],['100k+',3]]).map(([k,v])=>`<div class="dist-row"><span>${k}</span><div class="dist-track"><div class="dist-fill" style="width:${v/10*100}%"></div></div><span style="text-align:right" class="mono">${v}</span></div>`).join('')}</div><p class="disclaimer">按模拟样本统计，不代表平台总体分布。</p>`:`<div class="section-head"><h2>数据质量</h2></div>${[['有效记录','23 / 24','当前样本中 1 条缺失关键字段'],['缺失 Stars','1','该记录不参与相应统计'],['过期样本','2','保留标记，不假定当前仍然新鲜'],['覆盖范围','演示样本','不可推断 GitHub 全站结论']].map(([k,v,d])=>`<div class="quality-line"><div><strong>${k}</strong><p>${d}</p></div><strong>${v}</strong></div>`).join('')}`}`}`;}
function tasks(){let filtered=data.tasks.filter(t=>ui.taskTab==='all'||ui.taskTab==='active'&&['queued','running'].includes(t.status)||ui.taskTab==='done'&&['succeeded'].includes(t.status)||ui.taskTab==='problem'&&['partial','failed'].includes(t.status));const selected=data.tasks.find(t=>t.id===Number(ui.selectedTask));return `${header('任务','查看采集状态、任务记录和失败原因。',btn('新建演示任务','task-add',{small:true,icon:'plus'}))}<div class="task-tabs">${[['all','全部'],['active','进行中'],['done','已完成'],['problem','需关注']].map(([id,label])=>`<button class="seg ${ui.taskTab===id?'active':''}" data-action="task-tab" data-id="${id}">${label}</button>`).join('')}</div><div class="list-board">${filtered.length?filtered.map(t=>{const r=getRepo(t.repoId);return `<div class="task-line"><div><strong>${esc(r?.name||'未知仓库')}</strong><div class="tiny muted">${t.type==='deep'?'深度':'基础'}分析 · ${dt(t.created)} · #${t.id}</div></div>${stateTag(t.status)}<div class="taskpercent"><span class="tiny muted">${t.status==='queued'?'等待启动':'阶段进度 '+t.progress+'%'}</span><div class="prog" style="margin-top:7px"><span style="width:${t.progress}%"></span></div></div><button class="entry-click" data-action="select-task" data-id="${t.id}" aria-label="查看任务 ${t.id}">${ico('chev')}</button></div>`}).join(''):empty('这里还没有任务','新建分析后将自动出现任务记录。')}</div>${selected?`<div class="selected-task"><div class="task-controls"><h3>任务详情 <span class="mono muted tiny">#${selected.id}</span></h3><button class="icon-btn" data-action="close-task">${ico('cross')}</button></div><div class="task-controls"><strong>${esc(getRepo(selected.repoId)?.name||'未知仓库')}</strong>${stateTag(selected.status)}</div><div class="prog"><span style="width:${selected.progress}%"></span></div><div class="task-info-grid"><div><span>分析类型</span><strong>${selected.type==='deep'?'深度分析':'基础分析'}</strong></div><div><span>阶段进度</span><strong>${selected.progress}%</strong></div><div><span>创建日期</span><strong>${dt(selected.created)}</strong></div></div><p class="disclaimer">${esc(selected.message||'任务处理中')}。阶段进度不等于历史数据覆盖率。</p><ul class="step-list">${[['采集数据',20],['清洗数据',55],['生成分析',85],['保存结果',100]].map(([label,n])=>`<li><span class="step-dot ${selected.progress>=n?'done':selected.status==='running'&&selected.progress>=n-20?'current':''}"></span>${label}</li>`).join('')}</ul><div class="page-actions" style="margin-top:22px">${['failed','partial'].includes(selected.status)?btn('重新执行','retry-task',{id:selected.id,small:true,kind:'primary'}):''}${btn('打开仓库','open-detail',{id:selected.repoId,small:true})}</div></div>`:''}`;}

if(ui.modal==='reset')return `<div class="layer" data-action="dismiss"><div class="modal" role="alertdialog" aria-modal="true"><div class="modal-head"><h2>重置演示数据？</h2><button class="icon-btn" data-action="dismiss">${ico('cross')}</button></div><p>这将清除本地操作记录，并恢复最初的 演示仓库与任务。不会影响任何真实系统。</p><div class="modal-foot">${btn('取消','dismiss',{small:true})}${btn('恢复初始状态','reset-confirm',{kind:'primary',small:true})}</div></div></div>`;
if(ui.modal==='search')return `<div class="layer" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="全局搜索"><div class="modal-head"><h2>快速查找</h2><button class="icon-btn" data-action="dismiss">${ico('cross')}</button></div><div class="input-wrap">${ico('search')}<input id="global-query" autofocus class="field" value="${esc(ui.globalQuery)}" aria-label="搜索仓库" placeholder="输入仓库名称"></div><div class="search-results" id="global-results">${globalResults()}</div><p style="margin-top:13px">按 Esc 关闭 · 可搜索已保存仓库和示例仓库</p></div></div>`;

function render(){document.documentElement.dataset.theme=data.theme;document.documentElement.dataset.density=data.density;ROOT.innerHTML=appShell();}
let toastTimer=0;function toast(message){let parent=$('#toasts');if(!parent){render();parent=$('#toasts');}parent.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const el=$('#toasts');if(el)el.innerHTML='';},3300);}
function createTask(repoId,type='basic'){const exists=activeTasks().find(t=>t.repoId===repoId);if(exists){ui.selectedTask=exists.id;return exists;}const t={id:data.nextTask++,repoId,type,status:'queued',progress:0,created:now(),message:'等待开始采集'};data.tasks.unshift(t);const r=getRepo(repoId);if(r)r.status='queued';save();return t;}
function analyze(raw){let value=raw.trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\/?[?#].*$/,'').replace(/\/$/,'');if(!/^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(value)){toast('请输入 owner/repo 或标准 GitHub 仓库链接');return;}let r=data.repos.find(x=>x.name.toLowerCase()===value.toLowerCase());if(!r){r={id:data.nextRepo++,name:value,description:'自定义 演示仓库 · 未连接真实 GitHub',language:'未知',stars:null,forks:null,commits:null,issues:null,prs:null,releases:null,updated:null,coverage:'unknown',status:'queued',added:now(),collected:null,series:[]};data.repos.unshift(r);}if(!data.library.includes(r.id)){data.library.unshift(r.id);createTask(r.id);save();toast('仓库已添加，模拟任务已排队');}else{toast('仓库已在分析库中，打开现有结果');}ui.inputRepo='';ui.repoId=r.id;ui.repoTab='overview';go('detail');}
function downloadCSV(filename,rows){const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV 文件已导出');}
function csvRepos(repos,name='githubda-repositories-mock.csv'){downloadCSV(name,[['仓库','语言','Stars','Forks','提交90天','分析状态'],...repos.map(r=>[r.name,r.language,r.stars,r.forks,r.commits,names[r.status]||r.status])]);}
function act(action,id,el){switch(action){case'nav':go(String(id));break;case'mobile-open':ui.mobile=true;render();break;case'mobile-close':ui.mobile=false;render();break;case'repos-tab':ui.tab=String(id);render();break;case'discover-go':ui.tab='discover';go('repositories');break;case'open-detail':ui.repoId=Number(id);ui.repoTab='overview';go('detail');break;case'analyze-repo':analyze(getRepo(id).name);break;case'add-modal':ui.modal='add';render();$('#add-form input')?.focus();break;case'select-repo':{const n=Number(id);if(data.selected.includes(n))data.selected=data.selected.filter(x=>x!==n);else if(data.selected.length>=5){toast('最多选择 5 个仓库');el.checked=false;return;}else data.selected.push(n);save();render();break;}case'clear-selected':data.selected=[];save();render();break;case'compare-go':if(data.selected.length>=2&&data.selected.length<=5)go('compare');else toast('请选择 2–5 个仓库');break;case'detail-add-compare':if(!data.library.includes(Number(id))){data.library.unshift(Number(id));createTask(Number(id));}if(!data.selected.includes(Number(id))&&data.selected.length<5)data.selected.push(Number(id));else if(!data.selected.includes(Number(id))){toast('对比最多 5 个仓库');return;}save();toast('已加入待对比列表');go('compare');break;case'compare-remove':data.selected=data.selected.filter(x=>x!==Number(id));save();render();break;case'detail-tab':ui.repoTab=String(id);render();break;case'new-task':case'deep-task':{const r=getRepo(id);const t=createTask(Number(id),action==='deep-task'?'deep':'basic');toast(`任务已排队 #${t.id}`);render();break;}case'csv-library':csvRepos(library());break;case'csv-compare':csvRepos(data.selected.map(getRepo).filter(Boolean),'githubda-comparison-mock.csv');break;case'csv-research':downloadCSV('githubda-research-mock.csv',[['group','count'],['TypeScript',9],['Python',6],['Rust',5],['Go',4]]);break;case'research-tab':ui.researchTab=String(id);render();break;case'switch-dataset':ui.dataset='oss-2025';render();break;case'task-tab':ui.taskTab=String(id);render();break;case'open-task':ui.selectedTask=Number(id);go('tasks');break;case'select-task':ui.selectedTask=Number(id);render();break;case'close-task':ui.selectedTask=null;render();break;case'task-add':{const r=library().find(x=>!activeTasks().some(t=>t.repoId===x.id))||library()[0]||data.repos[0];const existing=activeTasks().find(t=>t.repoId===r.id);const t=createTask(r.id,'deep');ui.selectedTask=t.id;render();toast(existing?'已打开进行中的任务':'已添加模拟深度采集任务');break;}case'retry-task':{const prev=data.tasks.find(t=>t.id===Number(id));if(!prev||!['failed','partial'].includes(prev.status))return;const t=createTask(prev.repoId,prev.type);ui.selectedTask=t.id;save();render();toast('已创建新的重试任务');break;}case'remove-ask':ui.removeId=Number(id);ui.modal='remove';render();break;case'remove-confirm':data.library=data.library.filter(x=>x!==ui.removeId);data.selected=data.selected.filter(x=>x!==ui.removeId);ui.modal=null;save();go('repositories');toast('仓库已从列表移除');break;case'reset-ask':ui.modal='reset';render();break;case'reset-confirm':{const th=data.theme,den=data.density;data=seed();data.theme=th;data.density=den;ui.modal=null;ui.selectedTask=null;ui.libQuery='';ui.tab='saved';save();go('overview');toast('演示数据已恢复初始状态');break;}case'settings':ui.modal='settings';render();break;case'toggle-theme':data.theme=data.theme==='light'?'dark':'light';save();render();break;case'set-theme':data.theme=String(id);save();render();break;case'set-density':data.density=String(id);save();render();break;case'dismiss':if(el.closest('.modal')&&el.classList.contains('layer'))return;ui.modal=null;render();break;case'search-modal':ui.globalQuery='';ui.modal='search';render();$('#global-query')?.focus();break;case'global-open':ui.modal=null;ui.repoId=Number(id);ui.repoTab='overview';go('detail');break;default:break;}}
ROOT.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){if(target.tagName==='INPUT'&&target.type==='checkbox')return;act(target.dataset.action,target.dataset.id,target);}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t&&!ROOT.contains(t))act(t.dataset.action,t.dataset.id,t);});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.action==='select-repo'){act('select-repo',x.dataset.id,x);return;}switch(x.id){case'library-status':ui.libStatus=x.value;render();break;case'library-sort':ui.libSort=x.value;render();break;case'research-dataset':ui.dataset=x.value;ui.researchTab='overview';render();break;case'research-group':ui.group=x.value;render();break;case'trend-metric':ui.compareMetric=x.value;render();break;case'compare-add':if(x.value){if(data.selected.length>=5){toast('最多选择 5 个仓库');return;}const n=Number(x.value);if(!data.selected.includes(n))data.selected.push(n);save();render();}break;}});
let filterTimer;document.addEventListener('input',e=>{const x=e.target;if(x.id==='hero-repo')ui.inputRepo=x.value;else if(x.id==='library-query'){ui.libQuery=x.value;clearTimeout(filterTimer);let pos=x.selectionStart;filterTimer=setTimeout(()=>{render();const n=$('#library-query');if(n){n.focus();n.setSelectionRange(pos,pos);}},160);}else if(x.id==='global-query'){ui.globalQuery=x.value;const root=$('#global-results');if(root)root.innerHTML=globalResults();}});
document.addEventListener('submit',e=>{if(!['hero-form','add-form','discover-form'].includes(e.target.id))return;e.preventDefault();const form=e.target;if(form.id==='hero-form'){analyze(form.elements.repo.value);}else if(form.id==='add-form'){analyze(form.elements.repo.value);}else{ui.discoverQuery=form.elements.query.value;ui.discoverLang=form.elements.language.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();act('search-modal');}});
window.addEventListener('hashchange',routeHash);
setInterval(()=>{let changed=false;for(const t of data.tasks){if(t.status==='queued'){t.status='running';t.progress=5;t.message='正在连接演示数据源';changed=true;}else if(t.status==='running'){t.progress=Math.min(100,t.progress+Math.max(7,Math.round(9+Math.random()*8)));t.message=t.progress<40?'正在采集仓库信息':t.progress<75?'正在整理分析指标':'正在保存模拟快照';if(t.progress>=100){t.status='succeeded';t.message='采集已完成';let r=getRepo(t.repoId);if(r){r.status='completed';r.coverage='complete';r.collected=now();} }changed=true;}}if(changed){save();const focus=document.activeElement;if(!ui.modal && !(focus instanceof HTMLInputElement)&&!(focus instanceof HTMLSelectElement))render();}},2300);
routeHash();
})();
</script></body></html>
